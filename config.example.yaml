# 复制为 config.yaml 后填写。字符串里可用 ${ENV_VAR} 或 ${ENV_VAR:-默认值} 读取环境变量。

# ---- 第三方 Claude API 站点 (OpenAI 兼容格式) ----
claude:
  base_url: ${CLAUDE_BASE_URL:-https://your-third-party-site/v1}
  api_key: ${CLAUDE_API_KEY}          # 建议放环境变量，不要写死在文件里
  model: claude-3-5-sonnet
  max_tokens: 2048
  temperature: 0.7
  timeout: 120

# ---- OB (Ombre Brian) 的 MCP 接口 (HTTP / SSE, JSON-RPC streamable-http) ----
# Ombre Brian 暴露的工具: breath(检索/浮现记忆) dream(读新桶) grow(写日记)
#   hold(存记忆) pulse(看状态) trace(改元数据)。拉记忆用 breath。
mcp:
  enabled: true
  base_url: ${OB_MCP_URL:-http://10.190.98.158:8000/mcp}  # 填你 Ombre Brian 的 HTTP 端点
  token: ${OB_MCP_TOKEN}              # 作为 Authorization: Bearer 发送 (没有就留空)
  memory_tool: breath                 # 记忆检索/浮现工具
  query_field: query                  # 用户输入填到 query 字段; 留空则自动浮现
  memory_args:                        # 传给 breath 的固定参数
    max_results: 5
    max_tokens: 1500
    # importance_min: 3               # >=1 时改为按重要度拉取, 不走语义搜索
  timeout: 30
  # 回合结束自动把对话写回 OB, 形成长期记忆闭环
  write_back:
    enabled: true
    tool: grow                        # grow=日记归档(自动拆桶) / hold=单条记忆
    min_chars: 10                     # 内容太短不写
    # 下面两项仅 tool: hold 时生效
    tags: "对话,siwei"
    importance: 5

# ---- 人格模板 ----
persona:
  dir: personas
  default: default

# ---- 本地思维链规则引擎 (不调任何 API) ----
cot:
  enabled: true
  # 不填 rules 时使用脚本内置的默认规则。如需自定义，按下面格式覆盖:
  # rules:
  #   - name: code
  #     pattern: "(报错|bug|异常|traceback)"
  #     thoughts:
  #       - "先定位错误类型与触发条件。"
  #       - "结合记忆里的相关代码上下文给出修复。"

# 保留多少轮历史 (一轮 = 一问一答)
max_history: 10
