# 复制为 config.yaml 后填写。字符串里可用 ${ENV_VAR} 或 ${ENV_VAR:-默认值} 读取环境变量。

# ---- 第三方 Claude API 站点 (OpenAI 兼容格式) ----
claude:
  base_url: ${CLAUDE_BASE_URL:-https://your-third-party-site/v1}
  api_key: ${CLAUDE_API_KEY}          # 建议放环境变量，不要写死在文件里
  model: claude-3-5-sonnet
  max_tokens: 2048
  temperature: 0.7
  timeout: 120

# ---- OB 的 MCP 接口 (HTTP / SSE, JSON-RPC streamable-http) ----
mcp:
  enabled: true
  base_url: ${OB_MCP_URL:-https://your-ob-host/mcp}
  token: ${OB_MCP_TOKEN}              # 作为 Authorization: Bearer 发送
  memory_tool: search_memory          # OB 暴露的记忆检索工具名
  query_field: query                  # 把用户输入填到这个参数字段
  memory_args:                         # 传给工具的固定参数
    limit: 5
  timeout: 30

# ---- 人格模板 ----
persona:
  dir: personas
  default: default

# ---- 本地思维链规则引擎 (不调任何 API) ----
cot:
  enabled: true
  # 不填 rules 时使用脚本内置的默认规则。如需自定义，按下面格式覆盖:
  # rules:
  #   - name: code
  #     pattern: "(报错|bug|异常|traceback)"
  #     thoughts:
  #       - "先定位错误类型与触发条件。"
  #       - "结合记忆里的相关代码上下文给出修复。"

# 保留多少轮历史 (一轮 = 一问一答)
max_history: 10
